[project]
name = "fantasion-backend"
version = "0.1.0"
description = "Backend for Fantasion website"
authors = [{ name = "Pavel Žák", email = "pavel@zak.global" }]
requires-python = ">=3.10"
dependencies = [
  "czech-sort==1.1.0",
  "django-admin-sso==5.1.0",
  "django-cors-headers==3.13.0",
  "django-encrypted-model-fields==0.6.5",
  "django-extensions==3.2.3",
  "django-filter==22.1",
  "django-modeltranslation==0.18.11",
  "django-money==3.0.0",
  "django-nested-admin==4.0.2",
  "django-phonenumber-field[phonenumbers]==7.0.2",
  "djangorestframework-camel-case==1.3.0",
  "djangorestframework==3.14.0",
  "django-simplemde==0.1.4",
  "django-storages[google]==1.13.2",
  "django-versatileimagefield>=3.0",
  "django==4.2.28",
  "ffmpeg>=1.4",
  "fiobank==4.0.0",
  "gunicorn==22.0.0",
  "markdown==3.3.6",
  "psycopg2-binary>=2.9.9",
  "python-dateutil==2.8.2",
  "python-magic-bin==0.4.14; sys_platform == 'win32'",
  "qrcode>=7.4.2",
  "djangomni-search==0.3.0",
]

[dependency-groups]
dev = [
  "flake8==6.0.0",
  "freezegun==1.2.2",
  "model-bakery==1.9.0",
  "pytest==7.2",
  "yapf==0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "fantasion",
  "fantasion_api",
  "fantasion_banking",
  "fantasion_content",
  "fantasion_domain",
  "fantasion_eshop",
  "fantasion_expeditions",
  "fantasion_generics",
  "fantasion_locations",
  "fantasion_people",
  "fantasion_signups",
]

[tool.hatch.build.targets.sdist]
include = [
  "fantasion/",
  "fantasion_api/",
  "fantasion_banking/",
  "fantasion_content/",
  "fantasion_domain/",
  "fantasion_eshop/",
  "fantasion_expeditions/",
  "fantasion_generics/",
  "fantasion_locations/",
  "fantasion_people/",
  "fantasion_signups/",
  "manage.py",
  "**/*.mo",
]
